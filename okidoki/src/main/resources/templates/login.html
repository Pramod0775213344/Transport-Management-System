<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS</title>
    <link rel="icon" href="images/tab-logo.png">

    <link rel=stylesheet href="/fontawesome-free-6.6.0-web/fontawesome-free-6.6.0-web/css/all.css">
    <link rel="stylesheet" href="bootstrap/bootstrap-5.2.3/css/bootstrap.min.css">

    <script defer src="/commenjs/loading.js" ></script>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/common.css">
    <script src="jquery/jquery-3.7.1.min.js"></script>

</head>

<body>
    <div class="container-fluid d-flex">
        <!-- left side -->
        <div class="image-section">
            <!-- short  video -->
            <video autoplay muted loop id="myVideo">
                <source src="video/video.mp4" type="video/mp4">
            </video>
            <div class="image-content" align="center">
                <h2>Welcome to OKI-DOKI Terminal</h2>
                <p>Experience seamless collaboration and endless possibilities with our innovative tools.</p>
            </div>
        </div>

        <!-- right side -->
        <div class="login-section">
            <div class="login-box">
                <!-- login form header ->(logo)  -->
                <div class="login-header">
                    <img src="images/header-logo.png" alt="Logo">
                    <h1>Welcome back</h1>
                    <p>Enter your credentials to access your account</p>
                </div>

                <!-- login form -->
                <form action="/login" method="post" class="sign-in-form">
                    <div class="form-group">
                        <label for="textUsername">Username</label>
                        <div class="input-group">
                            <input type="text" id="textUsername" placeholder="Enter Username" required name="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="textpassword">Password</label>
                        <div class="input-group">
                            <input type="password" id="textPassword" placeholder="Enter Password" required
                                name="password">
                        </div>
                    </div>

                    <div class="remember-forgot">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="/forgetpassword" class="forgot-password" target="_blank">Forgot password?</a>

                    </div>
                    <div class="error-message" id="errorMessage"></div>
                    <div class="d-flex justify-content-center">

                        <button class="btn-3d btn-3d-submit" onclick="signingButton()">Sign in to your account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>

</body>

</html>
