<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="/css/report.css">
    <script src="/chart/chart.min.js"></script>
    <link rel="stylesheet" href="/css/bookingReport.css">
</head>

<body>
    <div th:replace="fragments/loading :: preloaderFragment"></div>
    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid load-hidden">

                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                    <div>
                        <h4 class="mb-1 fw-bold" style="color: #1e293b;">Bookings Performance Report</h4>
                        <p class="text-muted small mb-0">Operational efficiency and booking lifecycle analytics.
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-2 px-4" id="printReportBtn" onclick="printBookingReport()">
                            <i class="fa-solid fa-print me-2"></i>Print Report
                        </button>
                    </div>
                </div>


                <!-- filter area -->
                <div>
                    <div class="main-card">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <div>
                                <h5 class="mb-1 fw-bold" style="color: #1e293b;">Filter</h5>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">

                            <div class="col">
                                <label for="selectCustomer" class="form-label">Customer <span
                                        class="text-danger">*</span></label>
                                <select id="selectCustomer" class="form-select" required>
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Vehicle</label>
                                <select id="selectVehicle" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Driver</label>
                                <select id="selectDriver" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Status</label>
                                <select id="selectStatus" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Start Date</label>
                                <input type="date" id="startDateFilter" class="form-control">
                            </div>

                            <div class="col">
                                <label class="form-label">End Date</label>
                                <input type="date" id="endDateFilter" class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Period</label>
                                <select id="selectPeriod" class="form-select">
                                    <option value="all">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                            </div>

                            <div class="col">
                                <button type="button" onclick="bookingReportTable()" class="btn btn-submit">
                                    Generate Report
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" onclick="refreshReport()" class="btn btn-cancel text-black">
                                    Reset
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- trend chart area eka show karanwa -->
                <div class="main-card mb-3 mt-3">
                    <div class="p-3 mt-3">
                        <h1 style="font-size: 1.5rem;font-weight: 600;color: #1A202C;">Booking Trend
                        </h1>
                        <p style="font-size: 0.85rem; color: #64748b;">Compare scheduled vs actual performance to
                            identify trends and areas for improvement.</p>

                    </div>
                    <div class="p-4">
                        <div class="chart-wrapper" style="height: 350px; width: 100%; position: relative;">
                            <canvas id="bookingCountChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- table eka -->
                <div class="main-card">
                    <div class="table-header-wrapper">
                        <div class="text-center w-100 mt-3"
                            style="color: #1e293b; font-size: 0.9rem; letter-spacing: 0.05rem;">
                            <h2 class="text-center mb-0">Booking Summary</h2>
                        </div>
                    </div>

                    <div class="table-responsive report-table-container" id="viewMoadl">
                        <table class="table" id="bookingReportTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Booking No</th>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Supplier</th>
                                    <th>Driver</th>
                                    <th>Vehicle No</th>
                                    <th>Distance</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="bookingReportTableBody"></tbody>
                        </table>
                        <div th:replace="fragments/loading :: tableOverlayFragment"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="/js/bookingReport.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
