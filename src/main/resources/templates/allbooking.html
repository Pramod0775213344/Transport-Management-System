<!doctype html>
<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="/css/booking.css" />
    <style>
        /* New Premium Search & Filter Bar */
        .search-filter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .premium-search-container {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .premium-search-input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .premium-search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            outline: none;
        }

        .search-icon-fixed {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .filter-dropdowns {
            display: flex;
            gap: 12px;
        }

        .filter-select {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            min-width: 140px;
        }

        /* Modern Tabs Styling from Image */
        .premium-status-tabs {
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .premium-tab {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .premium-tab:hover {
            color: var(--primary);
        }

        .premium-tab.active {
            background: #ffffff;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tab-badge {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Enhanced Table Styling */
        .all-booking-table thead th {
            background: transparent;
            border-bottom: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: none;
            padding: 16px;
        }

        .all-booking-table tbody td {
            padding: 16px;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.875rem;
        }

        .copy-icon {
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 8px;
            transition: color 0.2s;
        }

        .copy-icon:hover {
            color: var(--primary);
        }

        .customer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .customer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Pillar Status Styles */
        .status-pill-modern {
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            transition: transform 0.2s;
        }

        .status-pill-modern:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .sp-processing {
            background: #e0f2fe;
            color: #0284c7;
        }

        .sp-intransit {
            background: #fef3c7;
            color: #d97706;
        }

        .sp-delivered {
            background: #dcfce7;
            color: #16a34a;
        }

        .sp-cancelled {
            background: #f3f4f6;
            color: #4b5563;
        }

        .sp-delayed {
            background: #fee2e2;
            color: #dc2626;
        }

        .route-path-visual {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .action-dot-btn {
            padding: 4px 8px;
            color: #94a3b8;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .action-dot-btn:hover {
            color: var(--primary);
            background: #f1f5f9;
        }

        /* Animation for dropdowns */
        .animated-dropdown {
            animation: slideIn 0.2s ease-out;
            border: 1px solid #f1f5f9 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <!-- Premium Preloader -->
    <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>

            <div class="container-fluid load-hidden" id="main">
                <div
                    th:replace="fragments/pageHeader :: pageHeaderFragment('Booking Management', 'Track and manage all container and cargo bookings within the system.')">
                </div>
                <!-- Top Section: Search and Filters -->
                <div class="search-filter-section mt-4">
                    <div class="search-container">
                        <input type="text" id="allTableSearch" class="form-control" placeholder="Search bookings, customers, routes...">
                    </div>
                    <div class="filter-dropdowns">
                        <select class="filter-select" id="filterStatus">
                            <option value="">All Status</option>
                        </select>
                        <select class="filter-select" id="filterCustomer">
                            <option value="">All Customers</option>
                        </select>
                        <select class="filter-select" id="filterVehicle">
                            <option value="">All Vehicles</option>
                        </select>
                    </div>
                </div>

                <!-- Tabs Section -->
                <div id="statusTabsWrapper" class="premium-status-tabs">
                    <button class="premium-tab active" data-status-id="all" onclick="filterByStatus('all', this)">
                        All <span class="tab-badge" id="count-all">(0)</span>
                    </button>
                    <!-- Status tabs dynamically injected -->
                </div>

                <!-- Main Table Card -->
                <div class="main-card border-0 shadow-sm" style="border-radius: 16px; overflow: hidden;">
                    <div class="table-responsive">
                        <table class="table all-booking-table mb-0" id="allBookingTable">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Route & Vehicle</th>
                                    <th>Distance</th>
                                    <th>Status</th>
                                    <th>Delivery Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="allBookingTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                        <div th:replace="fragments/loading :: tableOverlayFragment"></div>
                    </div>

                    <!-- Pagination Area -->
                    <div class="d-flex justify-content-between align-items-center p-3 border-top bg-white">
                        <div class="text-muted small">
                            Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> entries
                        </div>
                        <div id="custom-pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Booking Details Modal (Standard View) -->
    <div class="modal fade" id="bookingViewForm" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-body p-0">
                    <div class="modalheader">
                        <h1 id="viewBookingNoHead">Booking Details</h1>
                        <p id="viewBookingRefHead">Reference information</p>
                        <button type="button" class="close-btn" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="p-4" id="bookingPrintPreview">
                        <div class="row g-4">
                            <!-- Left: Profile Info -->
                            <div class="col-md-4">
                                <div class="card-sub-view h-100">
                                    <div class="text-center mb-4">
                                        <div class="avatar-view" style="justify-content: center; height: 120px;">
                                            <i class="fa-solid fa-truck-moving"
                                                style="font-size: 3rem; color: var(--primary);"></i>
                                        </div>
                                        <h2 class="mt-3 fw-bold" id="viewBookingNo">...</h2>
                                        <span class="status-view active" id="viewBookingStatus">...</span>
                                    </div>

                                    <div class="info-list">
                                        <div class="info-row">
                                            <span class="key">Customer</span>
                                            <span class="val" id="viewCustomerName">...</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="key">Vehicle Type</span>
                                            <span class="val" id="viewVehicleType">...</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="key">Contact</span>
                                            <span class="val" id="viewContactPersonName">...</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="key">Phone</span>
                                            <span class="val" id="viewContactPersonPhone">...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Logistics Info -->
                            <div class="col-md-8">
                                <div class="row g-4">
                                    <div class="col-6">
                                        <div class="card-sub-view">
                                            <h3 class="section-title"><i
                                                    class="fa-solid fa-location-dot me-2 text-success"></i>Pickup</h3>
                                            <p class="fw-bold mb-1" id="dataPickupLocation">...</p>
                                            <span class="text-muted small" id="dataPickupDateAndTime">...</span>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="card-sub-view">
                                            <h3 class="section-title"><i
                                                    class="fa-solid fa-flag-checkered me-2 text-danger"></i>Delivery
                                            </h3>
                                            <p class="fw-bold mb-1" id="dataDeliveryLocation">...</p>
                                            <span class="text-muted small" id="dataDeliveryDateAndTime">...</span>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="card-sub-view">
                                            <h3 class="section-title">Route Map</h3>
                                            <div id="viewMap" class="rounded-3 bg-light"
                                                style="height: 300px; display: flex; align-items: center; justify-content: center;">
                                                <span class="text-muted">Loading Map Integration...</span>
                                            </div>
                                            <div class="mt-3 d-flex justify-content-between">
                                                <span class="text-muted">Total Distance</span>
                                                <span class="fw-bold text-primary" id="dataDistance">0 km</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/allbooking.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
