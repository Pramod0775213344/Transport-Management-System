<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/report.css">
    <script src="chart/chart.min.js"></script>
    <link rel="stylesheet" href="css/bookingReport.css">
    <link rel="stylesheet" href="css/reportDriverPerfomance.css">

</head>

<body>
        <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid load-hidden">
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                    <div>
                        <h4 class="mb-1 fw-bold" style="color: #1e293b;">Driver Performance Summary</h4>
                        <p class="text-muted small mb-0">Detailed overview of driver performance metrics
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-2 px-4" id="printReportBtn" onclick="printDriverPerfomanceReport()">
                            <i class="fa-solid fa-print me-2"></i>Print Report
                        </button>
                    </div>
                </div>


                <!-- filter area -->
                <div>
                    <div class="main-card">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <div>
                                <h5 class="mb-1 fw-bold" style="color: #1e293b;">Filter</h5>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">

                            <div class="col">
                                <label for="selectDriver" class="form-label">Driver<span
                                        class="text-danger">*</span></label>
                                <select id="selectDriver" class="form-select" required>
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label for="selectSupplier" class="form-label">Supplier</label>
                                <select id="selectSupplier" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label for="selectStatus" class="form-label">Status</label>
                                <select id="selectStatus" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>


                            <div class="col">
                                <label for="startDateFilter" class="form-label">Start Date</label>
                                <input type="date" id="startDateFilter" class="form-control">
                            </div>

                            <div class="col">
                                <label for="endDateFilter" class="form-label">End Date</label>
                                <input type="date" id="endDateFilter" class="form-control">
                            </div>
                            <div class="col-auto">
                                <button type="button" onclick="driverPerformanceReport()" class="btn btn-submit">
                                    Generate Report
                                </button>
                            </div>
                            <div class="col-auto">
                                <button type="button" onclick="refreshReport()" class="btn btn-cancel text-black">
                                    Reset
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- trend chart area eka show karanwa -->
                <div class="main-card mb-3 mt-2">
                    <div class="p-3 mt-3">
                        <h1 style="font-size: 1.5rem;font-weight: 600;color: #1A202C;">Top Performing Drivers

                        </h1>
                        <p style="font-size: 0.85rem; color: #64748b;">Ranked by completed trips and on-time rate.</p>

                    </div>
                    <div class="p-4">
                        <div class="chart-wrapper" style="height: 350px; width: 100%; position: relative;">
                            <canvas id="driverPerformanceChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- table eka -->
                <div class="main-card mt-3">
                    <div class="table-header-wrapper">
                        <div class="text-center w-100 mt-3"
                            style="color: #1e293b; font-size: 0.9rem; letter-spacing: 0.05rem;">
                            <h2 class="text-center mb-0">Driver Performance Summary</h2>
                        </div>
                    </div>

                    <div class="table-responsive report-table-container" id="viewMoadl">
                        <table class="table" id="driverPerformanceReportTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Supplier</th>
                                    <th>Driver Name</th>
                                    <th>Total Trips</th>
                                    <th>On Time</th>
                                    <th>AVG Delay</th>
                                    <th>Total Distance</th>
                                    <th>Perfomance</th>
                                </tr>
                            </thead>
                            <tbody id="driverPerformanceReportTableBody"></tbody>
                        </table>
                        <div th:replace="fragments/loading :: tableOverlayFragment"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- <div th:replace="fragments/loading :: overlayFragment"></div> -->


    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/reportDriverPerfomance.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
