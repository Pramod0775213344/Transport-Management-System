<!DOCTYPE html>
<html lang="en">


<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/package.css">

</head>

<body>
    <!-- Premium Preloader -->
    <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid load-hidden" id="main">

                <!-- Page Header -->
                <div class="d-flex justify-content-between">
                    <div th:replace="fragments/pageHeader :: pageHeaderFragment('Package Management', 'Create and manage service packages for floating and fixed
                            rates.')">
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-2 px-4 shadow-sm" type="button" data-bs-toggle="modal" id="addButton"
                            data-bs-target="#packageFormModal">
                            <i class="fa-solid fa-circle-plus me-2"></i>
                            Add Package
                        </button>
                    </div>
                </div>

                <!--packages container-->
                <div id="package-container">
                </div>
                <!--packages container-->

            </div>
        </div>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="packageFormModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="modalheader">
                        <h1 id="modalTitle">Package Configuration</h1>
                        <p id="modalSubtitle">Define rates and distance rules for this package.</p>
                        <button type="button" class="close-btn" data-bs-dismiss="modal" onclick="refereshPackageForm()">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <form id="packageForm" onsubmit="return false">
                        <div class="px-2">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="packageType" class="form-label text-slate-500 fw-medium">Package
                                        Type <span class="text-danger">*</span></label>
                                    <select id="packageType" class="form-select"
                                        onchange="selectElementValidator(this,'package','package_type')" required>
                                        <option value="" selected disabled>Select Type...</option>
                                        <option value="Floating Rate">Floating Rate</option>
                                        <option value="Fix Rate">Fixed Rate</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3" id="packageDistanceContainer">
                                    <label for="packageDistance" class="form-label text-slate-500 fw-medium">Distance
                                        (Km) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="text" id="packageDistance" placeholder="0"
                                            class="form-control border-end-0" required>
                                        <span class="input-group-text bg-white text-slate-400">KM</span>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="textPackageName" class="form-label text-slate-500 fw-medium">Generated
                                        Package Name</label>
                                    <input type="text" id="textPackageName" class="form-control bg-light fw-bold"
                                        readonly placeholder="Auto-generated name..." required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="packageCustomerCharge"
                                        class="form-label text-slate-500 fw-medium">Customer
                                        Base Charge <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span
                                            class="input-group-text bg-white border-end-0 text-slate-400 small">LKR</span>
                                        <input type="text" id="packageCustomerCharge" placeholder="0.00"
                                            class="form-control border-start-0"
                                            onkeyup="rateValidator(this,'^\\d+(\\.\\d{1,2})?$','package','package_charge_cus', 1), validateSupplierLessThanCustomer()"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="packageSupplierCharge"
                                        class="form-label text-slate-500 fw-medium">Supplier
                                        Base Charge <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span
                                            class="input-group-text bg-white border-end-0 text-slate-400 small">LKR</span>
                                        <input type="text" id="packageSupplierCharge" placeholder="0.00"
                                            class="form-control border-start-0"
                                            onkeyup="rateValidator(this,'^\\d+(\\.\\d{1,2})?$','package','package_charge_sup', 1), validateSupplierLessThanCustomer()"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3" id="packageAdditonalKmChargeCustomerContainer">
                                    <label for="packageAdditonalKmChargeCustomer"
                                        class="form-label text-slate-500 fw-medium">Extra KM Rate (Customer) <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span
                                            class="input-group-text bg-white border-end-0 text-slate-400 small">LKR</span>
                                        <input type="text" id="packageAdditonalKmChargeCustomer" placeholder="0.00"
                                            class="form-control border-start-0"
                                            onkeyup="rateValidator(this,'^\\d+(\\.\\d{1,2})?$','package','additinal_km_charge_cus', 1)"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3" id="packageAdditonalKmChargeSupplierContainer">
                                    <label for="packageAdditonalKmChargeSupplier"
                                        class="form-label text-slate-500 fw-medium">Extra KM Rate (Supplier) <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span
                                            class="input-group-text bg-white border-end-0 text-slate-400 small">LKR</span>
                                        <input type="text" id="packageAdditonalKmChargeSupplier" placeholder="0.00"
                                            class="form-control border-start-0"
                                            onkeyup="rateValidator(this,'^\\d+(\\.\\d{1,2})?$','package','additinal_km_charge_sup', 1)"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="selectPackageVehicleType"
                                        class="form-label text-slate-500 fw-medium">Vehicle Type <span
                                            class="text-danger">*</span></label>
                                    <select id="selectPackageVehicleType" class="form-select"
                                        onchange="selectDynamicElementValidator(this,'package','vehicle_type_id')"
                                        required>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3" style="display: none;">
                                    <label for="selectPackageStatus" class="form-label text-slate-500 fw-medium">Status
                                        <span class="text-danger">*</span></label>
                                    <select id="selectPackageStatus" class="form-select"
                                        onchange="selectDynamicElementValidator(this,'package','package_status_id')"
                                        required>
                                    </select>
                                </div>
                            </div>
                            <!-- buttons -->
                            <div class="col-12 mt-4 pt-3 border-top">
                                <div class="d-flex justify-content-end gap-3">
                                    <button type="button" class="btn-cancel" onclick="refereshPackageForm()">
                                        <i class="fa-solid fa-circle-xmark me-2"></i> Cancel
                                    </button>
                                    <button type="button" class="btn-update" id="updateButton"
                                        onclick="packageFormUpdate()">
                                        <i class="fa-solid fa-circle-arrow-up me-2"></i> Update
                                    </button>
                                    <button type="submit" class="btn-submit" id="submitButton"
                                        onclick="packageFormSubmit()">
                                        <i class="fa-solid fa-check-circle me-2"></i> Submit
                                    </button>
                                </div>
                            </div>
                            <!-- buttons -->

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- <div th:replace="fragments/loading :: overlayFragment"></div> -->

    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/package.js"></script>
    <script src="js/sidebar.js"></script>
    <script th:inline="javascript">
        window.modulePrivileges = window.modulePrivileges || {};
        window.modulePrivileges["Package Management"] = {
            // backend eken ena values nathi unoth false ganna
            privi_select: /*[[${userPrivilage != null ? userPrivilage.privi_select : false}]]*/ false,
            privi_insert: /*[[${userPrivilage != null ? userPrivilage.privi_insert : false}]]*/ false,
            privi_update: /*[[${userPrivilage != null ? userPrivilage.privi_update : false}]]*/ false,
            privi_delete: /*[[${userPrivilage != null ? userPrivilage.privi_delete : false}]]*/ false
        };
    </script>
</body>

</html>
