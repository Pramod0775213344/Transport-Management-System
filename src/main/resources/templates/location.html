<!DOCTYPE html>
<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="/css/location.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/lib/leaflet.css" />
</head>

<body>
    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid">

                <!-- Page Header -->
                <div class="row align-items-center justify-content-between mb-4">
                    <div class="col-auto">
                        <h1 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin: 0;">Location Management
                        </h1>
                        <p class="text-secondary m-0">Define and visualize operational points for transport routes.</p>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Form Area -->
                    <div class="col-xl-5">
                        <div class="main-card pb-1">
                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <h4 class="m-0" style="font-weight: 600; color: #475569;">Register New Point</h4>
                            </div>

                            <form onsubmit="return false" id="locationForm">
                                <div class="mb-4">
                                    <label for="selectCompanyNameForLocation" class="form-label fw-bold">Company
                                        Association <span class="text-danger">*</span></label>
                                    <select class="form-select" id="selectCompanyNameForLocation" required
                                        onchange="selectDynamicElementValidator(this,'locations','customer_id')">
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="locationName" class="form-label fw-bold">Point Name <span
                                            class="text-danger">*</span></label>
                                    <input type="text" placeholder="E.g., Colombo Warehouse" id="locationName"
                                        class="form-control" required
                                        onkeyup="validator(this,'^([A-Za-z]{1,16})([ ]{0,1})([A-Za-z]{0,16})([ ]{0,1})([A-Za-z]{0,16})([ ]{0,1})([A-Za-z]{0,16})([ ]{0,1})([A-Za-z]{0,16})$','locations','name')">
                                </div>

                                <div class="mb-4">
                                    <label for="locationAddress" class="form-label fw-bold">Address Details</label>
                                    <textarea class="form-control" placeholder="Search on map to fill address"
                                        id="locationAddress" name="address" rows="2" required readonly
                                        style="background-color: #f8fafc;"></textarea>
                                </div>

                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <label for="locationLatitude" class="form-label fw-bold">Latitude <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="locationLatitude" class="form-control"
                                            placeholder="E.g., 7.1234" required
                                            onkeyup="validator(this,'^[0-9.]+$','locations','latitude')">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="locationLongitude" class="form-label fw-bold">Longitude <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="locationLongitude" class="form-control"
                                            placeholder="E.g., 79.1234" required
                                            onkeyup="validator(this,'^[0-9.]+$','locations','longitude')">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold mb-3 d-block">Location Classification</label>
                                    <div class="d-flex flex-wrap gap-4">
                                        <div class="form-check custom-checkbox">
                                            <input class="form-check-input" type="checkbox" id="pickupLocationChkbox"
                                                value="pickup">
                                            <label class="form-check-label" for="pickupLocationChkbox">Pickup</label>
                                        </div>
                                        <div class="form-check custom-checkbox">
                                            <input class="form-check-input" type="checkbox" id="viaLocationChkbox"
                                                value="waypoint">
                                            <label class="form-check-label" for="viaLocationChkbox">Waypoint</label>
                                        </div>
                                        <div class="form-check custom-checkbox">
                                            <input class="form-check-input" type="checkbox" id="deliveryLocationChkbox"
                                                value="delivery">
                                            <label class="form-check-label"
                                                for="deliveryLocationChkbox">Delivery</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-5 mb-3 d-flex justify-content-end gap-3">
                                    <button type="button" class="btn-cancel px-4" onclick="refreshLocationForm()">
                                        <i class="fa-solid fa-circle-xmark me-2"></i>Cancel
                                    </button>
                                    <button type="submit" id="submitbtn" class="btn-submit px-4"
                                        onclick="locationFormSubmit()">
                                        <i class="fa-solid fa-check-circle me-2"></i>Save
                                    </button>
                                    <button type="submit" id="updatebtn" class="btn-update px-4"
                                        onclick="locationUpdate()" style="display: none;">
                                        <i class="fa-solid fa-arrows-rotate me-2"></i>Update
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Map Area -->
                    <div class="col-xl-7">
                        <div class="main-card p-0" style="overflow: hidden;">
                            <div class="p-3 border-bottom bg-light d-flex align-items-center gap-3">
                                <div class="flex-grow-1 position-relative">

                                    <input type="text" id="searchinput" placeholder="Search for a specific place..."
                                        class="form-control" style="padding-left: 40px; border-radius: 8px;">
                                </div>
                                <button id="search-button" class="btn btn-2 px-4 shadow-sm">
                                    <i class="fa-solid fa-magnifying-glass me-2"></i>Find
                                </button>
                            </div>

                            <div id="map" style="height: 600px;"></div>

                            <div class="p-2 bg-light border-top text-center">
                                <div id="error-message" class="text-danger small fw-bold"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Table Area -->
                    <div class="main-card mt-4 mb-5">
                        <div class="table-header-wrapper">
                            <!-- Left side: Search -->
                            <div class="search-container">
                                <input type="text" id="tableSearch" class="form-control"
                                    placeholder="Search Operational Points...">
                            </div>

                            <!-- Right side: Controls -->
                            <div class="d-flex align-items-center gap-3">
                                <select id="tableLength" class="form-select table-length-select">
                                    <option value="10" selected>10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>

                                <div class="dropdown">
                                    <button class="btn btn-export dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa-solid fa-arrow-up-from-bracket me-2"></i>Export
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                                        <li><a class="dropdown-item py-2" href="#" onclick="exportTable('excel')"><i
                                                    class="fa-solid fa-file-excel me-2 text-success"></i>Export
                                                Excel</a>
                                        </li>
                                        <li><a class="dropdown-item py-2" href="#" onclick="exportTable('pdf')"><i
                                                    class="fa-solid fa-file-pdf me-2 text-danger"></i>Export PDF</a>
                                        </li>
                                        <li>
                                            <hr class="dropdown-divider">
                                        </li>
                                        <li><a class="dropdown-item py-2" href="#" onclick="exportTable('print')"><i
                                                    class="fa-solid fa-print me-2 text-primary"></i>Print Table</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive p-3">
                            <table id="locationDataTable" class="table table-hover w-100">
                                <thead class="bg-light">
                                    <tr>
                                        <th>No</th>
                                        <th>Point Name</th>
                                        <th>Customer</th>
                                        <th>Address</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="locationTableBody">
                                    <!-- Data filled by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leaflet JS -->
        <script src="/lib/leaflet.js"></script>
        <script src="/commenjs/reusabal.js"></script>
        <script src="/commenjs/commanValidation.js"></script>
        <script src="/commenjs/commonTable.js"></script>
        <script src="js/location.js"></script>
        <script src="js/sidebar.js"></script>
        <script src="/lib/lrm-graphhopper.js"></script>

</body>

</html>
