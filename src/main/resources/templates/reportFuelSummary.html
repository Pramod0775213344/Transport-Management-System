<!DOCTYPE html>
<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/bookingReport.css">
    <link rel="stylesheet" href="css/reportIncome.css">
    <link rel="stylesheet" href="css/reportSupplierPayment.css">
    <style>
        #fuelSummaryReportTable {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin-bottom: 0;
        }

        #fuelSummaryReportTable thead th {
            background: #f8fafc;
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 24px;
            border-bottom: 1px solid #edf2f7;
            white-space: nowrap;
        }

        #fuelSummaryReportTable tbody tr {
            transition: all 0.2s ease;
        }

        #fuelSummaryReportTable tbody tr:hover {
            background-color: #f1f5f9 !important;
        }

        #fuelSummaryReportTable td {
            padding: 24px;
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
            color: #1e293b;
        }
    </style>
</head>

<body>
    <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>
        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>

            <div class="container-fluid py-4 load-hidden" id="main">
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                    <div>
                        <h4 class="mb-1 fw-bold" style="color: #1e293b;">Fuel Payment Summary Report</h4>
                        <p class="text-muted small mb-0">Detailed overview of vehicle fuel summary.
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-2 px-4" id="printReportBtn" onclick="printFuelSummaryReport()">
                            <i class="fa-solid fa-print me-2"></i>Print Report
                        </button>
                    </div>
                </div>

                <!-- filter area -->
                <div>
                    <div class="main-card">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <div>
                                <h5 class="mb-1 fw-bold" style="color: #1e293b;">Filter</h5>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">

                            <div class="col">
                                <label for="selectVehicle" class="form-label">Vehicle <span
                                        class="text-danger">*</span></label>
                                <select id="selectVehicle" class="form-select" required>
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label" for="selectDriver">Driver</label>
                                <select id="selectDriver" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label" for="selectFuelCardNo">Fuel Card No</label>
                                <select id="selectFuelCardNo" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label" for="startDateFilter">Start Date</label>
                                <input type="date" id="startDateFilter" class="form-control">
                            </div>

                            <div class="col">
                                <label class="form-label" for="endDateFilter">End Date</label>
                                <input type="date" id="endDateFilter" class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Period</label>
                                <select id="selectPeriod" class="form-select">
                                    <option value="all">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                            </div>

                            <div class="col">
                                <button type="button" onclick="fuelSummaryReport()" class="btn btn-submit">
                                    Generate Report
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" onclick="refreshReport()" class="btn btn-cancel text-black">
                                    Reset
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- trend chart area eka show karanwa -->
                <div class="main-card mb-3 mt-2">
                    <div class="p-3 mt-3">
                        <h1 style="font-size: 1.5rem;font-weight: 600;color: #1A202C;">Payment Trend
                        </h1>
                        <p style="font-size: 0.85rem; color: #64748b;">Compare payaments details over daily, monthly or
                            weekly
                            payments</p>

                    </div>
                    <div class="p-4">
                        <div class="chart-wrapper" style="height: 350px; width: 100%; position: relative;">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- table eka -->
                <div class="main-card">
                    <div class="table-header-wrapper">
                        <div class="text-center w-100 mt-3"
                            style="color: #1e293b; font-size: 0.9rem; letter-spacing: 0.05rem;">
                            <h2 class="text-center mb-0">Fuel Payment Summary</h2>
                        </div>
                    </div>

                    <div class="table-responsive report-table-container" id="viewMoadl">
                        <table class="table" id="fuelSummaryReportTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Booking No</th>
                                    <th>Vehicle No</th>
                                    <th>Driver Name</th>
                                    <th>Fuel Card No</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="fuelSummaryReportTableBody"></tbody>
                        </table>
                        <div th:replace="fragments/loading :: tableOverlayFragment"></div>
                    </div>

                    <div class="alert alert-warning mt-3">
                        <p class="mb-0 text-end mt-3 me-5">Total Price: <span id="totalPrice"></span></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="chart/chart.min.js"></script>
    <!-- Reusable logic -->
    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <!-- Page logic -->
    <script src="js/reportFuelSummary.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
