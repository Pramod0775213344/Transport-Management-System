<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<!-- report hub eka hadanna dapu css set eka -->

<head>
    <link rel="stylesheet" href="css/report.css">
    <!-- special hub styles kella -->
    <style>
        /* Minimal Report Card Styles */
        .report-card-minimal {
            background: #ffffff;
            border: 1px solid #e7e9ee;
            border-radius: 9px;
            padding: 16px;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .report-icon-minimal {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #64748b;
            background: #dbeafe;
        }

        .report-badge-minimal {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            text-transform: none;
            letter-spacing: 0;
        }

        .badge-active {
            background: #dcfce7;
            color: #15803d;
        }

        .report-title-minimal {
            margin-top: 16px;
            margin-bottom: 8px;
            font-size: 19px;
            line-height: 1.1;
            font-weight: 700;
            color: #0f172a;
        }

        .report-desc-minimal {
            margin: 0;
            font-size: 14px;
            line-height: 1.35;
            color: #334155;
            max-width: 96%;
        }

        .border-top-subtle {
            border-top: 1px solid #e5e7eb;
        }

        .report-foot-label {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .report-foot-date {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.1;
        }

        .btn-report-minimal {
            text-decoration: none;
            color: #0f172a;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1;
            white-space: nowrap;
        }

        .btn-report-minimal:hover {
            color: inherit;
            text-decoration: none;
            border: none;
        }

        @media (max-width: 1200px) {
            .report-title-minimal {
                font-size: 1.55rem;
            }

            .report-desc-minimal {
                font-size: 0.95rem;
            }

            .report-foot-date {
                font-size: 1.2rem;
            }

            .btn-report-minimal {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <!-- Premium Preloader -->
    <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid load-hidden" id="main">
                <div class="d-flex justify-content-between ">
                    <div
                        th:replace="fragments/pageHeader :: pageHeaderFragment('Report Hub', 'Access comprehensive analytics, operational reports, and financial summaries.')">
                    </div>
                    <!-- <div>
                        <input type="text" placeholder="Search reports..." name="search" id="searchInput" class="form-control" style="width: 450px;" />
                    </div> -->

                    <div class="mt-5">
                        <div class="chip-group d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Quick date range">

                            <input type="radio" class="btn-check" name="reporttype" id="chipAll" autocomplete="off"
                                value="All" checked>
                            <label class="btn" for="chipAll">All</label>

                            <input type="radio" class="btn-check" name="reporttype" id="chipAdministrative" autocomplete="off"
                                value="Administrative">
                            <label class="btn" for="chipAdministrative">Administrative</label>

                            <input type="radio" class="btn-check" name="reporttype" id="chipOperational"
                                autocomplete="off" value="Operational">
                            <label class="btn" for="chipOperational">Operational</label>

                            <input type="radio" class="btn-check" name="reporttype" id="chipFinancial" autocomplete="off"
                                value="Financial">
                            <label class="btn" for="chipFinancial">Financial</label>
                        </div>
                    </div>
                </div>
                <!-- Reports grid -->
                <div class="row g-4" id="reportsGrid">
                    <!-- Cards injected via js -->
                </div>
            </div>
        </div>
    </div>

    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/report.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
