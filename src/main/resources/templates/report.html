<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<!-- report hub eka hadanna dapu css set eka -->

<head>
    <link rel="stylesheet" href="css/report.css">
    <!-- special hub styles kella -->
    <style>
        .hub-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.02em;
        }

        .section-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header i {
            color: #f59e0b;
            font-size: 14px;
        }

        .section-header span {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
        }

        /* favorite report card ekata dapu styles */
        .favorite-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
            position: relative;
        }

        .favorite-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border-color: #ddd6fe;
        }

        .fav-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .fav-info .title {
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
        }

        .fav-info .meta {
            font-size: 11px;
            color: #94a3b8;
        }

        .fav-star {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #f59e0b;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid">
                <div th:replace="fragments/pageHeader :: pageHeaderFragment('Intelligence Hub', 'Access comprehensive analytics, operational reports, and financial summaries.')"></div>



                <!-- Main Report Filter Tabs & Explorer (Palla row eka) -->
                <div class="main-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-5">
                        <div class="filter-tabs-wrapper">
                            <ul class="nav nav-pills" id="filterTabs" role="tablist">
                                <li class="nav-item"><button class="nav-link active"
                                        onclick="filterByCategory('all')">All Reports</button></li>
                                <li class="nav-item"><button class="nav-link"
                                        onclick="filterByCategory('operations')">Operations</button></li>
                                <li class="nav-item"><button class="nav-link" onclick="filterByCategory('fleet')">Fleet
                                        & Compliance</button></li>
                                <li class="nav-item"><button class="nav-link"
                                        onclick="filterByCategory('finance')">Financials</button></li>
                            </ul>
                        </div>

                        <div class="d-flex gap-3">
                            <div class="search-container" style="max-width: 280px;">
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"
                                        style="border-radius: 12px 0 0 12px;"><i
                                            class="fas fa-search text-muted"></i></span>
                                    <input type="text" class="form-control border-0 bg-light" id="searchInput"
                                        placeholder="Find a report..." oninput="searchReports()"
                                        style="border-radius: 0 12px 12px 0; height: 42px;">
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Section Marker -->
                    <div class="section-header mb-4">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Reports Explorer</span>
                    </div>

                    <!-- Report Cards Grid -->
                    <div id="reportsContainer" class="row g-4 mb-5">
                        <!-- JS cards injection point -->
                    </div>

                    <!-- Pagination kella -->
                    <div class="d-flex justify-content-between align-items-center pt-4 border-top">
                        <div class="text-muted small" id="statPagination">Showing reports...</div>
                        <nav aria-label="Page navigation">
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item disabled"><a class="page-link" href="#"><i
                                            class="fa-solid fa-chevron-left"></i></a></li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item disabled"><a class="page-link" href="#">...</a></li>
                                <li class="page-item"><a class="page-link" href="#"><i
                                            class="fa-solid fa-chevron-right"></i></a></li>
                            </ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/report.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
