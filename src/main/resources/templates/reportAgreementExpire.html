<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/report.css">
    <script src="chart/chart.min.js"></script>
</head>

<body>
    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>

        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>
            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold" style="color: #1e293b;">Agreement Expire Report</h4>
                        <p class="text-muted small mb-0">Monitor agreement lifecycles, and upcoming expirations.
                        </p>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-2 px-4" id="printReportBtn" onclick="printAgreementReport()">
                            <i class="fa-solid fa-print me-2"></i>Print Overview
                        </button>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Progress Card: Contract Status Mix -->
                    <div class="col-lg-4">
                        <div class="main-card p-4">
                            <div class="d-flex align-items-center gap-2 mb-4">
                                <div class="chart-icon-container" style="color: #3b82f6;">
                                    <i class="fa-solid fa-chart-pie"></i>
                                </div>
                                <h5 class="mb-0 " style="color: #1e293b;">Agreement Status Distribution</h5>
                            </div>

                            <div class="chart-container-inner" style="position: relative; height: 300px; width: 100%;">
                                <canvas id="agreementStatusChart"></canvas>
                                <div class="chart-center-text">
                                    <h3 class="mb-0 " id="totalAgreementsCountText">0</h3>
                                    <span class="text-muted small ">TOTAL</span>
                                </div>
                            </div>

                            <div class="mt-5">
                                <div class="row g-3" id="agreementLegendContainer">
                                    <!-- <div class="col-6">
                                        <div class="d-flex justify-content-center align-items-center gap-2">
                                            <span class="status-dot" style="background: #10b981;"></span>
                                            <span class="small text-muted">Approved (<span
                                                    id="activePercent">0%</span>)</span>
                                        </div>
                                    </div> -->
                                    <div class="col-6">
                                        <div class="d-flex justify-content-center align-items-center gap-2">
                                            <span class="status-dot" style="background: #f59e0b;"></span>
                                            <span class="small  text-muted">Near Exp (<span
                                                    id="nearExpPercent">0%</span>)</span>
                                        </div>
                                    </div>
                                    <div class="col-6 ">
                                        <div class="d-flex justify-content-center align-items-center gap-2">
                                            <span class="status-dot" style="background: #ef4444;"></span>
                                            <span class="small text-muted">Expired (<span
                                                    id="expiredPercent">0%</span>)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Table Card: Detailed Agreement Inventory -->
                    <div class="col-lg-8">
                        <div class="main-card h-100 p-0 overflow-hidden" style="border-radius: 16px;">
                            <div class="table-header-wrapper px-4 py-3 ">
                                <div class="search-container">
                                    <input type="text" id="agreementSearch" class="form-control"
                                        placeholder="Search agreements...">
                                </div>

                                <div class="d-flex align-items-center gap-3">
                                    <select id="agreementTypeFilter" class="form-select" style="width: 150px;"
                                        onchange="loadAllAgreements()">
                                        <option value="All">All Types</option>
                                        <option value="Customer">Customer</option>
                                        <option value="Supplier">Supplier</option>
                                    </select>

                                    <select id="agreementTableLength" class="form-select table-length-select">
                                        <option value="10" selected>10</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                </div>
                            </div>

                            <div class="p-4">
                                <div class="table-responsive report-table-container">
                                    <table class="table mb-0" id="allAgreementsTable">
                                        <thead>
                                            <tr class="text-muted"
                                                style="font-size: 0.85rem; text-transform: uppercase;">
                                                <th>#</th>
                                                <th>AGREEMENT ID</th>
                                                <th>PARTNER NAME</th>
                                                <th>START DATE</th>
                                                <th>EXPIRY DATE</th>
                                                <th>STATUS</th>
                                                <th class="text-end px-4">ACTION</th>
                                            </tr>
                                        </thead>
                                        <tbody id="allAgreementsTableBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <script src="js/reportAgreementExpire.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
