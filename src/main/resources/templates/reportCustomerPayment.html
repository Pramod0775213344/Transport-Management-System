<!DOCTYPE html>
<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/bookingReport.css">
    <link rel="stylesheet" href="css/reportIncome.css">
    <link rel="stylesheet" href="css/reportCustomerPayment.css">

</head>

<body>
        <div th:replace="fragments/loading :: preloaderFragment"></div>

    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>
        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>

            <div class="container-fluid py-4 load-hidden" id="printableArea">
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                    <div>
                        <h4 class="mb-1 fw-bold" style="color: #1e293b;">Customer Payment Summary</h4>
                        <p class="text-muted small mb-0">Detailed overview of receivables and payment health across
                            enterprise
                            clients.
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-2 px-4" id="printReportBtn" onclick="printCustomerPaymentReport()">
                            <i class="fa-solid fa-print me-2"></i>Print Report
                        </button>
                    </div>
                  
                </div>


                <!-- filter area -->
                <div>
                    <div class="main-card">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <div>
                                <h5 class="mb-1 fw-bold" style="color: #1e293b;">Filter</h5>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">

                            <div class="col">
                                <label for="selectCustomer" class="form-label">Customer <span
                                        class="text-danger">*</span></label>
                                <select id="selectCustomer" class="form-select" required>
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Vehicle</label>
                                <select id="selectVehicle" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>

                            <div class="col">
                                <label class="form-label">Driver</label>
                                <select id="selectDriver" class="form-select">
                                    <option value="">All</option>
                                </select>
                            </div>


                            <div class="col">
                                <label class="form-label">Start Date</label>
                                <input type="date" id="startDateFilter" class="form-control">
                            </div>

                            <div class="col">
                                <label class="form-label">End Date</label>
                                <input type="date" id="endDateFilter" class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Period</label>
                                <select id="selectPeriod" class="form-select">
                                    <option value="all">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                            </div>

                            <div class="col">
                                <button type="button" onclick="customerPaymentReport()" class="btn btn-submit">
                                    Generate Report
                                </button>
                            </div>
                            <div class="col">
                                <button type="button" onclick="refreshReport()" class="btn btn-cancel text-black">
                                    Reset
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
                <!-- trend chart area eka show karanwa -->
                <div class="main-card mb-3 mt-2">
                    <div class="p-3 mt-3">
                        <h1 style="font-size: 1.5rem;font-weight: 600;color: #1A202C;">Payment Trend
                        </h1>
                        <p style="font-size: 0.85rem; color: #64748b;">payamnet comaprison will be showed here
                        </p>

                    </div>
                    <div class="p-4">
                        <div class="chart-wrapper" style="height: 350px; width: 100%; position: relative;">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- table eka -->
                <div class="main-card">
                    <div class="table-header-wrapper">
                        <div class="text-center w-100 mt-3"
                            style="color: #1e293b; font-size: 0.9rem; letter-spacing: 0.05rem;">
                            <h2 class="text-center mb-0">Customer Payment Summary</h2>
                        </div>
                    </div>

                    <div class="table-responsive report-table-container" id="viewMoadl">
                        <table class="table" id="customerPaymentTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Booking No</th>
                                    <th>Date</th>
                                    <th>Customet</th>
                                    <th>Driver</th>
                                    <th>Vehicle No</th>
                                    <th>Package Type</th>
                                    <th>Distance</th>
                                    <th>Total Price</th>
                                </tr>
                            </thead>
                            <tbody id="customerPaymentTableBody"></tbody>
                        </table>
                        <div th:replace="fragments/loading :: tableOverlayFragment"></div>
                    </div>

                      <div class="alert alert-warning mt-3">
                        <p class="mb-0 text-end mt-3 me-5">Total Price: <span id="totalPrice"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="chart/chart.min.js"></script>
    <!-- Reusable logic -->
    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <!-- Page logic -->
    <script src="js/reportCustomerPayment.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
