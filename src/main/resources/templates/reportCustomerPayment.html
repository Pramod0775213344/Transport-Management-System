<!DOCTYPE html>
<html lang="en">

<head th:replace="fragments/head :: headFragment"></head>

<head>
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/bookingReport.css">
    <link rel="stylesheet" href="css/reportIncome.css">
    <link rel="stylesheet" href="css/reportCustomerPayment.css">
    <style>
        .text-end {
            text-align: right !important;
        }

        @media print {
            .d-print-none {
                display: none !important;
            }

            .d-print-block {
                display: block !important;
            }

            body {
                background-color: white !important;
            }

            .main-content {
                margin-left: 0 !important;
                padding: 0 !important;
            }

            .container-fluid {
                padding: 0 !important;
            }

            .main-card {
                box-shadow: none !important;
                border: 1px solid #dee2e6 !important;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div th:replace="fragments/sidebar :: sidebarFragment"></div>
        <div class="main-content">
            <div th:replace="fragments/topbar :: topbarFragment"></div>

            <div class="container-fluid py-4" id="printableArea">
                <!-- Header Section -->
                <div class="report-header d-print-flex">
                    <div class="report-title-section">
                        <h1 class="page-header-title">Customer Payment Summary</h1>
                        <p class="report-subtitle">Detailed overview of receivables and payment health across enterprise
                            clients.</p>
                    </div>
                    <button class="btn btn-2 d-print-none" onclick="window.print()">
                        <i class="fas fa-print me-2"></i> Print Report
                    </button>
                </div>

                <!-- serarch area -->
                <div class="main-card mb-3">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start align-items-center gap-4 mt-3">
                            <div>
                                <label class="form-label">Customer</label>
                                <select name="" class="form-select" id="selectCustomerName" style="width: 250px;">
                                    <option value="">Select Customer</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Date Range</label>
                                <select name="" class="form-select" id="selectDateRange" style="width: 250px;">
                                    <option value="this_month">This Month</option>
                                    <option value="last_month">Last Month</option>
                                    <option value="last_3_months">Last 3 Months</option>
                                    <option value="last_6_months">Last 6 Months</option>
                                    <option value="this_year">This Year</option>
                                    <option value="custom">Custom Range</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control" id="fromDate" style="width: 250px;" disabled>
                            </div>
                            <div>
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" id="toDate" style="width: 250px;" disabled>

                            </div>
                            <div class=" mt-3 d-flex justify-content-center align-items-center gap-3">
                                <button class="btn btn-2 mt-3" data-bs-toggle="tooltip" data-bs-placement="top"
                                    data-bs-title="Search" onclick="currentmonthvehiclerevenue()"> Generate</button>
                                <button class="btn btn-1 mt-3" onclick="reset()"><i
                                        class="fa-solid fa-rotate-right me-3"></i>Reset</button>
                            </div>
                        </div>


                    </div>
                </div>

                <!-- Table Section -->
                <div class="main-card p-0 overflow-hidden" style="border-radius: 16px;">
                    <div class="table-header-wrapper px-4 py-3 d-flex justify-content-between align-items-center">
                        <div class="search-container">
                            <input type="text" id="tableSearch" class="form-control"
                                placeholder="Search customer payments...">
                        </div>

                        <div class="d-flex align-items-center gap-3">
                            <select id="tableLength" class="form-select table-length-select">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>

                            <div class="dropdown">
                                <button class="btn-export dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fa-solid fa-arrow-up-from-bracket me-2"></i>Export
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                                    <li><a class="dropdown-item py-2" href="#"
                                            onclick="exportToExcel('paymentTable', 'Customer_Payment_Report')">
                                            <i class="fa-solid fa-file-excel me-2 text-success"></i>Export Excel</a>
                                    </li>
                                    <li><a class="dropdown-item py-2" href="#" onclick="exportToPDF()">
                                            <i class="fa-solid fa-file-pdf me-2 text-danger"></i>Export PDF</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="p-4">
                        <div class="table-responsive report-table-container">
                            <table class="table mb-0 w-100" id="paymentTable">
                                <thead>
                                    <tr class="text-muted" style="font-size: 0.85rem; text-transform: uppercase;">
                                        <th>#</th>
                                        <th>Invoice No</th>
                                        <th>Invoice Date</th>
                                        <th>Payments</th>
                                        <th>Total Amount</th>
                                        <th>Paid Amount</th>
                                        <th>Pending Amount</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentTableBody">
                                    <!-- Data will be injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="chart/chart.min.js"></script>
    <!-- Reusable logic -->
    <script src="/commenjs/reusabal.js"></script>
    <script src="/commenjs/commanValidation.js"></script>
    <script src="/commenjs/commonTable.js"></script>
    <!-- Page logic -->
    <script src="js/reportCustomerPayment.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
